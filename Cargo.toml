[package]
name = "mysore-weather"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
urlencoding = "2"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
