[package]
name = "mysore-weather"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
scraper = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
imageproc = "0.25"
fontdue = "0.7"
rustybuzz = "0.12"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
urlencoding = "2"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
