<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<style>
  /* Feel free to hand-edit this file to restyle the generated images.
     Placeholders like {{TITLE}} are substituted by src/html_render.rs at build time.
     Kannada text is rendered by the headless browser (via image_gen.rs), so complex
     conjuncts/vowel-signs shape correctly -- unlike the old manual glyph-rasterizer.

     IMPORTANT: row sizing (ROW_HEIGHT / ROW_FONT_SIZE / etc.) is computed in Rust
     (src/html_render.rs) from the number of forecast days, and the table is given
     an explicit height equal to rows * row-height. This is deliberate: giving the
     table `flex: 1` inside a flex column let flexbox shrink rows below their text's
     natural line-height whenever content was tall, which is what caused the
     overlapping text. Don't reintroduce flex-grow/shrink on .forecast without also
     removing the fixed per-row heights below, or the overlap bug will come back. */
  @font-face {
    font-family: "Kannada";
    src: url("{{FONT_PATH}}");
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: {{WIDTH}}px;
    height: {{HEIGHT}}px;
    font-family: "Kannada", "Noto Sans Kannada", sans-serif;
    overflow: hidden;
  }
  body {
    /* CSS background-image is kept as a fallback, but the actual visible
       background is the <img class="bg"> element below -- some headless
       Chrome versions don't reliably composite a CSS background-image into
       --screenshot output, while a real <img> element almost always renders. */
    background-image: url("{{BG_IMAGE}}");
    background-size: cover;
    background-position: center;
    color: #ffffff;
    padding: {{PADDING_TOP}}px {{PADDING}}px {{PADDING_BOTTOM}}px {{PADDING}}px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    position: relative;
  }
  img.bg {
    position: fixed;
    top: 0;
    left: 0;
    width: {{WIDTH}}px;
    height: {{HEIGHT}}px;
    object-fit: cover;
    z-index: -1;
  }
  .content {
    position: relative;
    z-index: 1;
  }
  .source {
    position: fixed;
    left: 0;
    right: 0;
    bottom: {{SOURCE_BOTTOM}}px;
    text-align: center;
    font-size: {{SOURCE_FONT_SIZE}}px;
    opacity: 0.75;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    z-index: 2;
  }
  .header {
    height: {{HEADER_HEIGHT}}px;
  }
  .title {
    font-size: {{TITLE_SIZE}}px;
    font-weight: 700;
    line-height: 1.25;
    text-shadow: 0 2px 8px rgba(0,0,0,0.55);
  }
  .subtitle {
    font-size: {{SUBTITLE_SIZE}}px;
    line-height: 1.3;
    opacity: 0.92;
    margin-top: 6px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
  table.forecast {
    width: 100%;
    margin: 0 auto;
    height: {{TABLE_HEIGHT}}px;
    table-layout: fixed;
    border-collapse: separate;
    border-spacing: 0 {{ROW_GAP}}px;
  }
  table.forecast col.day { width: {{COL_DAY_PCT}}%; }
  table.forecast col.condition { width: {{COL_CONDITION_PCT}}%; }
  table.forecast col.temps { width: {{COL_TEMPS_PCT}}%; }
  table.forecast col.summary { width: {{COL_SUMMARY_PCT}}%; }
  table.forecast tr {
    height: {{ROW_HEIGHT}}px;
    background: rgba(0,0,0,0.42);
  }
  table.forecast tr:nth-child(even) {
    background: rgba(0,0,0,0.28);
  }
  table.forecast td {
    /* IMPORTANT: keep this as table-cell (the default for <td>). Do NOT put
       display:-webkit-box directly on a <td> -- that silently overrides
       table-cell layout and breaks the whole table (cells stack vertically
       full-width instead of sitting side by side as columns, and rows lose
       their fixed height). Any line-clamp styling goes on the .cell-clamp
       <div> wrapper INSIDE the cell instead -- see rows below. */
    height: {{ROW_HEIGHT}}px;
    padding: {{ROW_PAD_V}}px {{ROW_PAD_H}}px;
    font-size: {{ROW_FONT_SIZE}}px;
    line-height: 1.2;
    vertical-align: middle;
    overflow: hidden;
    word-break: break-word;
  }
  .cell-clamp {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: {{ROW_MAX_LINES}};
    overflow: hidden;
  }
  td.day {
    font-weight: 700;
    overflow: hidden;
  }
  td.day .day-name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  td.day .day-date {
    font-weight: 400;
    opacity: 0.85;
    font-size: 0.85em;
    white-space: nowrap;
  }
  td.temps { color: #ffe08a; font-weight: 700; }
  td.condition { opacity: 0.95; }
  td.summary {
    opacity: 0.9;
    font-size: {{SUMMARY_FONT_SIZE}}px;
  }
  td.summary .cell-clamp {
    -webkit-line-clamp: {{SUMMARY_MAX_LINES}};
  }
</style>
</head>
<body>
  <img class="bg" src="{{BG_IMAGE}}">
  <div class="content">
  <div class="header">
    <div class="title">{{TITLE}}</div>
    <div class="subtitle">{{SUBTITLE}}</div>
  </div>
  <table class="forecast">
    <colgroup>
      <col class="day"><col class="condition"><col class="temps"><col class="summary">
    </colgroup>
    {{ROWS}}
  </table>
  <div class="source">{{SOURCE_LABEL}}</div>
  </div>
</body>
</html>
